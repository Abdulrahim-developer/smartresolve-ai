server {
    listen 80;
    server_name localhost;

    # 1. RENDER REACT COMPRESSED UI ASSETS DIRECTLY
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. SEAMLESS INTERNAL BACKEND GATEWAY FORWARDING
    location /api/ {
        # Proxies incoming /api calls straight to your running Spring Boot backend container context path
        proxy_pass http://backend-prod:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
