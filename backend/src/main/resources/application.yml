server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: smartresolve-api

  # Activates high-performance concurrent virtual threads natively in Java 21
  threads:
    virtual:
      enabled: true

  # Configures Spring Boot's native script data engine
  sql:
    init:
      mode: never

  # Relational Database Connection Mappings
  datasource:
    url: jdbc:postgresql://localhost:5433/smartresolvedev
    username: srdev
    password: collegepass2026
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  # JPA / Hibernate Lifecycle Engines
  jpa:
    defer-datasource-initialization: true # Builds tables FIRST, then inserts data rows
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Valkey Caching Layer Protocol Mappings
  data:
    redis:
      host: localhost
      port: 6379
      password: valkeypass2026
      timeout: 3000

